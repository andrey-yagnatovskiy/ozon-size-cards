<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Генератор карточек Ozon{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">
      <span class="brand-mark">Rusbelt</span>
      <span class="brand-text">Генератор карточек размеров для Ozon</span>
    </a>
  </header>

  <main class="page">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    Карточки собираются из готовых макетов — товар, иконки и фон не изменяются.
  </footer>
</body>
</html>
